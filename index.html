<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!-- 不支援 SVG 圖示的瀏覽器用 PNG；支援的瀏覽器取後面的 SVG。iPhone 加到主畫面用 apple-touch-icon（直角，由 iOS 自行裁圓角）。 -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0&amp;icon_names=arrow_back,bookmark,check,close,directions_car,error,expand_more,local_parking,location_on,map,my_location,navigation,refresh,search"
      rel="stylesheet"
    />
    <title>EtPark</title>
    <meta
      name="description"
      content="搜尋店名或地址，查看附近停車場、剩餘車位與停車費，輕鬆找到適合的停車位。"
    />
    <meta
      property="og:title"
      content="EtPark"
    />
    <meta
      property="og:description"
      content="搜尋店名或地址，查看附近停車場、剩餘車位與停車費，輕鬆找到適合的停車位。"
    />
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://etpark.netlify.app/"
    />
    <!-- 分享預覽圖需完整網址；換網域時一併更新。圖檔原稿在設計稿「分享連結預覽圖 B」。 -->
    <meta
      property="og:image"
      content="https://etpark.netlify.app/og.png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />
    <meta
      property="og:image:alt"
      content="EtPark：找停車，先看剩幾位"
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
